upstream nixlifeos_frontend {
    server frontend:80;
}

upstream nixlifeos_backend {
    server backend-nginx:80;
}

upstream nixlifeos_ai_engine {
    server ai-engine:5000;
}

# ------------------------------------------------------------
# API HTTP - SSL is handled by Cloudflare / cloudflared
# ------------------------------------------------------------
server {
    listen 80;
    server_name api.nixlifeos.com;

    client_max_body_size 50M;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "nixlifeos nginx healthy\n";
    }

    location / {
        proxy_pass http://nixlifeos_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Accept $http_accept;
        proxy_set_header Content-Type $content_type;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# ------------------------------------------------------------
# APP HTTP - SSL is handled by Cloudflare / cloudflared
# ------------------------------------------------------------
server {
    listen 80;
    server_name app.nixlifeos.com nixlifeos.com www.nixlifeos.com;

    client_max_body_size 50M;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "nixlifeos nginx healthy\n";
    }

    # Same-origin API proxy for frontend fetch('/api/v1/...')
    location ^~ /api/ {
        proxy_pass http://nixlifeos_backend;
        proxy_http_version 1.1;

        proxy_set_header Host api.nixlifeos.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Accept $http_accept;
        proxy_set_header Content-Type $content_type;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /sw.js {
        proxy_pass http://nixlifeos_frontend/sw.js;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;

        add_header Service-Worker-Allowed "/" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /manifest.webmanifest {
        proxy_pass http://nixlifeos_frontend/manifest.webmanifest;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;

        proxy_hide_header Content-Type;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;

        default_type application/manifest+json;

        add_header Content-Type "application/manifest+json" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location ^~ /assets/ {
        proxy_pass http://nixlifeos_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /icons/ {
        proxy_pass http://nixlifeos_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /splash/ {
        proxy_pass http://nixlifeos_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /favicon.ico {
        proxy_pass http://nixlifeos_frontend/favicon.ico;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /favicon.svg {
        proxy_pass http://nixlifeos_frontend/favicon.svg;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /pwa/offline.html {
        proxy_pass http://nixlifeos_frontend/pwa/offline.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /pwa/ {
        proxy_pass http://nixlifeos_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location / {
        proxy_pass http://nixlifeos_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
}
