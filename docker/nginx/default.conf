upstream nixlifeos_frontend {
    server frontend:80;
}

upstream nixlifeos_backend {
    server backend-nginx:80;
}

upstream nixlifeos_ai_engine {
    server ai-engine:5000;
}

# ------------------------------------------------------------
# API HTTP → HTTPS
# ------------------------------------------------------------
server {
    listen 80;
    server_name api.nixlifeos.com;

    client_max_body_size 50M;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------
# API HTTPS
# ------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name api.nixlifeos.com;

    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/api.nixlifeos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nixlifeos.com/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        proxy_pass http://nixlifeos_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Accept "application/json";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# ------------------------------------------------------------
# APP HTTP → HTTPS
# ------------------------------------------------------------
server {
    listen 80;
    server_name app.nixlifeos.com nixlifeos.com www.nixlifeos.com;

    client_max_body_size 50M;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------
# APP HTTPS
# ------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name app.nixlifeos.com nixlifeos.com www.nixlifeos.com;

    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/app.nixlifeos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.nixlifeos.com/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ------------------------------------------------------------
    # PWA Service Worker
    # ------------------------------------------------------------
    location = /sw.js {
        proxy_pass http://nixlifeos_frontend/sw.js;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;

        add_header Service-Worker-Allowed "/" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # ------------------------------------------------------------
    # PWA Manifest
    # ------------------------------------------------------------
    location = /manifest.webmanifest {
        proxy_pass http://nixlifeos_frontend/manifest.webmanifest;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_hide_header Content-Type;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;

        default_type application/manifest+json;

        add_header Content-Type "application/manifest+json" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # ------------------------------------------------------------
    # Root PWA Icons
    # ------------------------------------------------------------
    location ^~ /icons/ {
        proxy_pass http://nixlifeos_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;

        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # ------------------------------------------------------------
    # Root PWA Splash Screens
    # ------------------------------------------------------------
    location ^~ /splash/ {
        proxy_pass http://nixlifeos_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;

        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # ------------------------------------------------------------
    # Favicons
    # ------------------------------------------------------------
    location = /favicon.ico {
        proxy_pass http://nixlifeos_frontend/favicon.ico;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;

        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location = /favicon.svg {
        proxy_pass http://nixlifeos_frontend/favicon.svg;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;

        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # ------------------------------------------------------------
    # Offline fallback
    # ------------------------------------------------------------
    location = /pwa/offline.html {
        proxy_pass http://nixlifeos_frontend/pwa/offline.html;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # ------------------------------------------------------------
    # PWA compatibility path
    # ------------------------------------------------------------
    location ^~ /pwa/ {
        proxy_pass http://nixlifeos_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # ------------------------------------------------------------
    # Vite hashed assets
    # ------------------------------------------------------------
    location ^~ /assets/ {
        proxy_pass http://nixlifeos_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;

        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # ------------------------------------------------------------
    # Vue SPA
    # ------------------------------------------------------------
    location / {
        proxy_pass http://nixlifeos_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
}
