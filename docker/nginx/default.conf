upstream nixlifeos_frontend {
    server frontend:80;
}

upstream nixlifeos_backend {
    server backend-nginx:80;
}

upstream nixlifeos_ai_engine {
    server ai-engine:5000;
}

server {
    listen 80;
    server_name app.nixlifeos.com nixlifeos.com www.nixlifeos.com;

    client_max_body_size 50M;

    # ------------------------------------------------------------
    # PWA Service Worker
    # Must not be cached aggressively
    # ------------------------------------------------------------
    location = /sw.js {
        proxy_pass http://nixlifeos_frontend/sw.js;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;

        add_header Service-Worker-Allowed "/" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # ------------------------------------------------------------
    # PWA Manifest
    # Force correct content type
    # ------------------------------------------------------------
    location = /manifest.webmanifest {
        proxy_pass http://nixlifeos_frontend/manifest.webmanifest;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Content-Type;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;

        add_header Content-Type "application/manifest+json" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # ------------------------------------------------------------
    # Offline fallback page
    # ------------------------------------------------------------
    location = /pwa/offline.html {
        proxy_pass http://nixlifeos_frontend/pwa/offline.html;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # ------------------------------------------------------------
    # PWA icons
    # Safe to cache long-term
    # ------------------------------------------------------------
    location ^~ /pwa/icons/ {
        proxy_pass http://nixlifeos_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;

        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # ------------------------------------------------------------
    # Other PWA files
    # ------------------------------------------------------------
    location ^~ /pwa/ {
        proxy_pass http://nixlifeos_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # ------------------------------------------------------------
    # Built Vue assets
    # Safe to cache because Vite generates hashed filenames
    # ------------------------------------------------------------
    location ^~ /assets/ {
        proxy_pass http://nixlifeos_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;

        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # ------------------------------------------------------------
    # Vue frontend app
    # ------------------------------------------------------------
    location / {
        proxy_pass http://nixlifeos_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
}

server {
    listen 80;
    server_name api.nixlifeos.com;

    client_max_body_size 50M;

    # ------------------------------------------------------------
    # Laravel Backend API
    # ------------------------------------------------------------
    location / {
        proxy_pass http://nixlifeos_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Accept $http_accept;
        proxy_set_header Content-Type $content_type;
    }
}