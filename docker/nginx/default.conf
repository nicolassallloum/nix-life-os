upstream nixlifeos_frontend {
    server frontend:80;
}

upstream nixlifeos_backend {
    server backend-nginx:80;
}

upstream nixlifeos_ai_engine {
    server ai-engine:5000;
}

server {
    listen 80;
    server_name app.nixlifeos.com nixlifeos.com www.nixlifeos.com api.nixlifeos.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.nixlifeos.com;

    ssl_certificate /etc/letsencrypt/live/app.nixlifeos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.nixlifeos.com/privkey.pem;

    client_max_body_size 50M;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "nixlifeos nginx healthy\n";
    }

    location / {
        proxy_pass http://nixlifeos_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl http2;
    server_name app.nixlifeos.com nixlifeos.com www.nixlifeos.com;

    ssl_certificate /etc/letsencrypt/live/app.nixlifeos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.nixlifeos.com/privkey.pem;

    client_max_body_size 50M;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "nixlifeos nginx healthy\n";
    }

    location ^~ /api/ {
        proxy_pass http://nixlifeos_backend;
        proxy_http_version 1.1;

        proxy_set_header Host api.nixlifeos.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /sw.js {
        proxy_pass http://nixlifeos_frontend/sw.js;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;

        add_header Service-Worker-Allowed "/" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /manifest.webmanifest {
        proxy_pass http://nixlifeos_frontend/manifest.webmanifest;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;

        proxy_hide_header Content-Type;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;

        default_type application/manifest+json;

        add_header Content-Type "application/manifest+json" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location ^~ /assets/ {
        proxy_pass http://nixlifeos_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://nixlifeos_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
}
