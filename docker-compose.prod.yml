services:
  postgres:
    image: postgres:16-alpine
    container_name: nixlifeos-postgres
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nixlifeos_db}
      POSTGRES_USER: ${POSTGRES_USER:-nixlifeos_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: ${TZ:-Asia/Beirut}
      PGDATA: /var/lib/postgresql
    expose:
      - "5432"
    volumes:
      - nixlifeos_postgres_data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - nixlifeos-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nixlifeos_user} -d ${POSTGRES_DB:-nixlifeos_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nixlifeos-backend
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - ./backend:/var/www/html
      - nixlifeos_backend_storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "9000"
    networks:
      - nixlifeos-network
    healthcheck:
      test: ["CMD-SHELL", "php artisan --version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend-nginx:
    image: nginx:1.27-alpine
    container_name: nixlifeos-backend-nginx
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    ports:
      - "8001:80"
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/backend-nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - nixlifeos-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nixlifeos-frontend
    restart: unless-stopped
    depends_on:
      - backend-nginx
    expose:
      - "80"
    networks:
      - nixlifeos-network

  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: nixlifeos-ai-engine
    restart: unless-stopped
    env_file:
      - .env.docker
    expose:
      - "5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nixlifeos-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    container_name: nixlifeos-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      #-  /docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend-nginx
      - ai-engine
    networks:
      - nixlifeos-network

  backend-queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nixlifeos-backend-queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    env_file:
      - .env.docker
    volumes:
      - ./backend:/var/www/html
      - nixlifeos_backend_storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - nixlifeos-network

  backend-scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nixlifeos-backend-scheduler
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    env_file:
      - .env.docker
    volumes:
      - ./backend:/var/www/html
      - nixlifeos_backend_storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - nixlifeos-network

volumes:
  nixlifeos_postgres_data:
  nixlifeos_backend_storage:

networks:
  nixlifeos-network:
    driver: bridge
