server {
    listen 80;
    server_name app.nixlifeos.com api.nixlifeos.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;

    server_name app.nixlifeos.com;

    ssl_certificate /etc/letsencrypt/live/app.nixlifeos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.nixlifeos.com/privkey.pem;

    location / {
        proxy_pass http://frontend:80;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    http2 on;

    server_name api.nixlifeos.com;

    ssl_certificate /etc/letsencrypt/live/api.nixlifeos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nixlifeos.com/privkey.pem;

    location / {
        proxy_pass http://backend-nginx:80;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}