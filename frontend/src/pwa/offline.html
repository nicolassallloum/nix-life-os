<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Nix Life OS — Offline</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      background: radial-gradient(circle at top, #0f172a, #020617);
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      max-width: 440px;
      width: 100%;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(6, 182, 212, 0.35);
      border-radius: 24px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 22px;
      background: linear-gradient(135deg, #06b6d4, #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 800;
      color: white;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 26px;
    }

    p {
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    button {
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, #06b6d4, #7c3aed);
      color: white;
      padding: 12px 20px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="logo">N</div>

    <h1>You are offline</h1>

    <p>
      Nix Life OS cannot connect right now. Some cached dashboard data may still be available once you return to the app.
    </p>

    <button onclick="window.location.reload()">
      Try Again
    </button>
  </div>
</body>
</html>
