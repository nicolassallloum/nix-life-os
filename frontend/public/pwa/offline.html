<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nix Life OS — Offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #020617;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .card {
      max-width: 420px;
      padding: 32px;
      border-radius: 24px;
      background: #0f172a;
      border: 1px solid rgba(6, 182, 212, 0.35);
    }

    h1 {
      margin-bottom: 12px;
    }

    p {
      color: #94a3b8;
      line-height: 1.6;
    }

    button {
      margin-top: 20px;
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      background: linear-gradient(135deg, #06b6d4, #7c3aed);
      color: white;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Nix Life OS is Offline</h1>
    <p>Please check your internet connection. Some cached features may still be available.</p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
