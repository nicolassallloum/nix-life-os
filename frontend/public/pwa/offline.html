<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Nix Life OS - Offline</title>

  <style>
    :root {
      --bg: #020617;
      --card: #0f172a;
      --primary: #22d3ee;
      --secondary: #8b5cf6;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: rgba(148, 163, 184, 0.2);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(34, 211, 238, 0.16), transparent 30%),
        radial-gradient(circle at bottom right, rgba(139, 92, 246, 0.18), transparent 30%),
        var(--bg);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .offline-card {
      width: 100%;
      max-width: 520px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 36px;
      text-align: center;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(18px);
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 20px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      font-size: 36px;
      font-weight: 800;
      color: white;
      box-shadow: 0 0 32px rgba(34, 211, 238, 0.35);
    }

    h1 {
      font-size: 28px;
      margin: 0 0 12px;
    }

    p {
      color: var(--muted);
      line-height: 1.7;
      margin: 0 0 24px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 14px 24px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(34, 211, 238, 0.2);
    }

    .status {
      margin-top: 18px;
      font-size: 14px;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <main class="offline-card">
    <div class="logo">N</div>

    <h1>You are offline</h1>

    <p>
      Nix Life OS cannot connect to the server right now.
      Please check your internet connection and try again.
    </p>

    <button onclick="window.location.reload()">
      Try Again
    </button>

    <div class="status">
      Offline mode is active.
    </div>
  </main>
</body>
</html>
